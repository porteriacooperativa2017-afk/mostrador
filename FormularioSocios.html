<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal de Socios - Autorización de Retiro</title>
  <style>
    :root{--bg-color:#050b14;--panel-bg:rgba(10,25,47,.95);--neon-green:#00ffcc;--neon-blue:#0099ff;--text-color:#e0f0ff}
    *{box-sizing:border-box}
    body{background-color:var(--bg-color);background-image:radial-gradient(circle at 50% 10%,#0d1b2a 0%,#050b14 100%);color:var(--text-color);font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;margin:0;padding:20px}
    .container{max-width:750px;margin:30px auto;background:var(--panel-bg);border:1px solid var(--neon-blue);box-shadow:0 0 25px rgba(0,153,255,.25);border-radius:12px;padding:clamp(20px,5vw,40px)}
    h2{color:var(--neon-green);text-align:center;text-transform:uppercase;letter-spacing:1px}
    p.subtitle{text-align:center;color:#8ab4f8;font-size:14px;margin-bottom:30px}
    label{display:block;margin-top:15px;font-weight:bold;color:var(--text-color);font-size:14px}
    input{background:#020813;border:1px solid #1a365d;color:var(--text-color);padding:12px;margin-top:5px;width:100%;border-radius:6px;font-size:15px}
    input:focus{outline:none;border-color:var(--neon-green);box-shadow:0 0 8px rgba(0,255,204,.4)}
    .grid-par{display:grid;grid-template-columns:2fr 1fr;gap:15px;background:rgba(0,153,255,.03);border:1px dashed rgba(0,153,255,.3);padding:15px;border-radius:6px;margin-top:15px}
    button{background:linear-gradient(135deg,#0055ff,#00ffcc);color:#000;font-weight:bold;padding:14px;margin-top:25px;width:100%;border:0;border-radius:6px;cursor:pointer;font-size:16px;text-transform:uppercase;transition:all .3s ease}
    button:hover{box-shadow:0 0 15px var(--neon-green);transform:translateY(-2px)}
    button:disabled{opacity:.65;cursor:wait;transform:none}
    #mensaje{display:none;text-align:center;background:rgba(0,255,204,.15);border:1px solid var(--neon-green);color:var(--neon-green);padding:20px;border-radius:6px;margin-top:20px}
    #mensaje.error{background:rgba(255,51,102,.12);border-color:#ff3366;color:#ff9ab2}
    #mensaje button{width:auto;padding:8px 20px;margin-top:10px}
    @media(max-width:560px){.grid-par{grid-template-columns:1fr;gap:4px}}
  </style>
</head>
<body>
  <main class="container">
    <h2>Portal de Socios - Autorización de Retiro</h2>
    <p class="subtitle">Complete los datos de la farmacia y asigne el personal autorizado</p>
    <form id="miFormulario">
      <label for="email">Correo Electrónico de Notificación:</label>
      <input type="email" id="email" required placeholder="ejemplo@farmacia.com">
      <label for="farmacia">Nombre de la Farmacia:</label>
      <input type="text" id="farmacia" required placeholder="Ingrese nombre comercial...">
      <label for="codigo">Código de Farmacia (Solo números):</label>
      <input type="text" id="codigo" inputmode="numeric" pattern="[0-9]+" required placeholder="Ej: 1001">
      <hr style="margin:25px 0;border-color:#1a365d">
      <h3 style="color:var(--neon-blue);font-size:16px">Personal Autorizado y DNI</h3>
      <div id="autorizados"></div>
      <button type="submit" id="btnEnviar">Enviar Autorización</button>
    </form>
    <section id="mensaje" role="status" aria-live="polite">
      <h3 id="mensaje-titulo"></h3>
      <p id="mensaje-texto"></p>
      <button type="button" id="btnOtro" hidden>Cargar otro</button>
    </section>
  </main>
  <script>
    const authorizedFields = document.getElementById('autorizados');
    for (let i = 1; i <= 6; i++) {
      const group = document.createElement('div');
      group.className = 'grid-par';
      group.innerHTML = '<div><label for="p' + i + '">Personal Autorizado ' + i + ':</label><input type="text" id="p' + i + '" placeholder="Apellido y Nombre"></div>' +
        '<div><label for="dni' + i + '">DNI ' + i + ':</label><input type="text" id="dni' + i + '" inputmode="numeric" pattern="[0-9 .-]*" placeholder="Solo números"></div>';
      authorizedFields.appendChild(group);
    }

    const form = document.getElementById('miFormulario');
    const button = document.getElementById('btnEnviar');
    const message = document.getElementById('mensaje');
    const messageTitle = document.getElementById('mensaje-titulo');
    const messageText = document.getElementById('mensaje-texto');
    const anotherButton = document.getElementById('btnOtro');

    function showMessage(text, isError) {
      messageTitle.textContent = isError ? 'No se pudo completar el registro' : '¡Registro enviado con éxito!';
      messageText.textContent = text;
      message.className = isError ? 'error' : '';
      message.style.display = 'block';
      anotherButton.hidden = isError;
    }

    form.addEventListener('submit', function(event) {
      event.preventDefault();
      button.disabled = true;
      button.textContent = 'PROCESANDO...';
      message.style.display = 'none';
      anotherButton.hidden = true;

      const data = {
        email: document.getElementById('email').value.trim(),
        farmacia: document.getElementById('farmacia').value.trim(),
        codigo: document.getElementById('codigo').value.trim()
      };
      for (let i = 1; i <= 6; i++) {
        data['p' + i] = document.getElementById('p' + i).value.trim();
        data['dni' + i] = document.getElementById('dni' + i).value.trim();
      }

      google.script.run
        .withSuccessHandler(function(result) {
          if (result && result.exito) {
            form.style.display = 'none';
            showMessage(result.aviso || 'Los datos se guardaron correctamente y se envió el correo de confirmación.', false);
            return;
          }
          showMessage('Error al guardar: ' + (result && result.error ? result.error : 'Respuesta no válida del servidor.'), true);
          button.disabled = false;
          button.textContent = 'Enviar Autorización';
        })
        .withFailureHandler(function(error) {
          showMessage('No se pudo procesar el formulario: ' + (error && error.message ? error.message : error), true);
          button.disabled = false;
          button.textContent = 'Enviar Autorización';
        })
        .procesarFormularioSocios(data);
    });

    anotherButton.addEventListener('click', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
